# dnsmasq.conf - DNS interno del Laboratorio 14 (UTP)
# Zonas .local resueltas de forma explícita, sincronizadas con docker-compose-network.yml

# No reenviar consultas: solo resuelve lo declarado aquí
no-resolv
no-hosts

# Registros A de la zona front (172.28.10.0/24)
address=/web.local/172.28.10.10
address=/api.local/172.28.10.20
address=/dns.local/172.28.10.53

# Registros A de la zona back (172.28.20.0/24)
address=/db.local/172.28.20.20

# Escuchar en todas las interfaces del contenedor (por defecto en dnsmasq).
# NO usar `interface=0.0.0.0`: espera un NOMBRE de interfaz (ej. eth0), no una IP,
# y con un valor inválido dnsmasq termina respondiendo solo en loopback.

# Log de consultas (útil para la demostración en clase)
log-queries
