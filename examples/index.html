<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Swarm - Múltiples Réplicas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; }
        .status { 
            display: inline-block; 
            padding: 5px 15px; 
            background: #4CAF50; 
            color: white; 
            border-radius: 20px; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐳 Docker Swarm</h1>
        <p>Este contenedor está corriendo en un clúster de Docker Swarm</p>
        <p>Status: <span class="status">✅ Funcionando</span></p>
        <p><small>Deployed with Portainer</small></p>
    </div>
</body>
</html>
