# Stack de ejemplo para el clúster Swarm: nginx con 3 réplicas + servicio de prueba.
# Desplegar con:  docker stack deploy -c docker-compose-examples.yml my-nginx
#
# NOTA: en Swarm los servicios con `replicas` no pueden usar `container_name`
# (cada réplica necesita su propio nombre) y `docker stack deploy` no construye
# imágenes: por eso aquí se usan imágenes ya publicadas.

# Sin `name:`: `docker stack deploy` toma el nombre del argumento de la CLI.
services:
  web:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/index.html:/usr/share/nginx/html/index.html:ro
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # Servicio de prueba: se despliega en TODOS los nodos (mode: global)
  hello:
    image: alpine:latest
    command: ["sh", "-c", "while true; do echo \"hello from $(hostname)\"; sleep 30; done"]
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
