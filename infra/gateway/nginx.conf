user  nginx;
worker_processes  auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 0;

    # ---------------------------------------------------------------
    # ENTRADA DEL TÚNEL (Cloudflare -> http://localhost:9000)
    #
    #   /            -> app del Lab 14 (stack segmentado)
    #   /portainer/  -> Portainer (base-url /portainer/)
    #
    # Todo detrás de Basic Auth.
    # ---------------------------------------------------------------
    server {
        listen 127.0.0.1:9000;
        server_name _;

        auth_basic           "Lab 14";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Redirección para que /portainer (sin barra) no caiga en la app
        location = /portainer {
            return 301 /portainer/;
        }

        # Portainer: nginx quita el prefijo /portainer/ (la app escucha en raíz)
        location /portainer/ {
            proxy_pass http://127.0.0.1:9001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /portainer;
            proxy_read_timeout 3600;
            proxy_buffering off;
        }

        # App del Laboratorio 14
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------------------------------------------
    # Acceso local directo (solo loopback, no lo usa el túnel)
    #   App       -> http://localhost:8088
    #   Portainer -> http://localhost:9090/portainer/
    # ---------------------------------------------------------------
    server {
        listen 127.0.0.1:8088;
        server_name _;

        auth_basic           "Lab 14 - App";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 127.0.0.1:9090;
        server_name _;

        auth_basic           "Portainer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location = / {
            return 301 /portainer/;
        }

        location /portainer/ {
            proxy_pass http://127.0.0.1:9001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /portainer;
            proxy_read_timeout 3600;
            proxy_buffering off;
        }
    }
}
